name: lab-cassandra

x-cass: &cass
  image: cassandra:4.1.12
  healthcheck:
    test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
    interval: 20s
    timeout: 15s
    retries: 30
    start_period: 60s
  environment: &cass-env
    CASSANDRA_CLUSTER_NAME: lab
    CASSANDRA_SEEDS: 172.20.0.11
    CASSANDRA_RPC_ADDRESS: 0.0.0.0
    MAX_HEAP_SIZE: 512M
    HEAP_NEWSIZE: 128M

services:
  n1:
    <<: *cass
    container_name: n1
    environment:
      <<: *cass-env
      CASSANDRA_LISTEN_ADDRESS: 172.20.0.11
      CASSANDRA_BROADCAST_ADDRESS: 172.20.0.11
      CASSANDRA_BROADCAST_RPC_ADDRESS: 172.21.0.11
    networks:
      cluster:
        ipv4_address: 172.20.0.11
      clientes:
        ipv4_address: 172.21.0.11
  n2:
    <<: *cass
    container_name: n2
    environment:
      <<: *cass-env
      CASSANDRA_LISTEN_ADDRESS: 172.20.0.12
      CASSANDRA_BROADCAST_ADDRESS: 172.20.0.12
      CASSANDRA_BROADCAST_RPC_ADDRESS: 172.21.0.12
    depends_on:
      n1:
        condition: service_healthy
    networks:
      cluster:
        ipv4_address: 172.20.0.12
      clientes:
        ipv4_address: 172.21.0.12
  n3:
    <<: *cass
    container_name: n3
    environment:
      <<: *cass-env
      CASSANDRA_LISTEN_ADDRESS: 172.20.0.13
      CASSANDRA_BROADCAST_ADDRESS: 172.20.0.13
      CASSANDRA_BROADCAST_RPC_ADDRESS: 172.21.0.13
    depends_on:
      n2:
        condition: service_healthy
    networks:
      cluster:
        ipv4_address: 172.20.0.13
      clientes:
        ipv4_address: 172.21.0.13

  gerador:
    build: ./gerador
    image: lab-gerador:1
    container_name: gerador
    working_dir: /app
    volumes:
      - ./gerador:/app
    command: sleep infinity
    networks:
      clientes:
        ipv4_address: 172.21.0.100


networks:
  cluster:
    name: lab_cluster
    ipam:
      config:
        - subnet: 172.20.0.0/24
  clientes:
    name: lab_clientes
    ipam:
      config:
        - subnet: 172.21.0.0/24

